[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "roofing-api"
version = "0.1.0"
requires-python = ">=3.11,<3.15"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn[standard]==0.38.0",
  "pydantic==2.14.1",
  "pydantic-settings==2.14.1",
  "python-multipart==0.0.20",
  "python-dotenv==1.2.1",
  "firebase-admin==7.1.0",
  "google-auth==2.62.0",
  "google-genai==2.31.0",
  "httpx==0.28.1",
  "PyMuPDF==1.27.2",
]

[project.scripts]
roofing-api = "app.run:main"

[project.optional-dependencies]
dev = [
  "pytest==9.0.2",
  "ruff==0.14.10",
  "mypy==1.19.1",
  "pytest-cov==7.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["emulator: requires running Firebase Auth and Firestore emulators"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
